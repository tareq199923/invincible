[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invincible-ai"
dynamic = ["version"]
description = "Multi-provider AI gateway with session memory and MCP tool execution"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "PyYAML",
    "python-dotenv",
    "click",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "greenlet",
    "alembic>=1.13",
    "argon2-cffi",
    "cryptography",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "build",
    "ruff",
]

[project.scripts]
invincible = "invincible.cli:cli"
inv = "invincible.cli:cli"

[tool.setuptools.dynamic]
version = { attr = "invincible.__version__" }

[tool.setuptools.packages.find]
include = ["invincible*"]

[tool.setuptools.package-data]
invincible = [
    "providers.yaml",
    "migrations/script.py.mako",
    "templates/*.html",
    "templates/static/*",
]

[tool.ruff]
target-version = "py310"
exclude = [
    "venv",
    ".venv",
    ".venv-review",
    ".venv-package-test",
    ".verify",
    "build",
    "dist",
    ".pytest_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection calls are the sanctioned default-argument
# idiom (Depends(require_auth) on route handlers).
extend-immutable-calls = ["fastapi.Depends"]
