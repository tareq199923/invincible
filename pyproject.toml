[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "invincible-ai"
dynamic = ["version"]
description = "Multi-provider AI gateway with session memory and MCP tool execution"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Islam MD. Jahidul", email = "jahidulislam199923@gmail.com" },
]
keywords = [
    "ai", "gateway", "llm", "mcp", "openai", "anthropic",
    "proxy", "failover", "byok", "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "PyYAML",
    "python-dotenv",
    "click",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "greenlet",
    "alembic>=1.13",
    "argon2-cffi",
    "cryptography",
    "jinja2",
    "websockets",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "build",
    "twine",
    "setuptools>=77",
    "ruff",
]

[project.scripts]
invincible = "invincible.cli:cli"
inv = "invincible.cli:cli"

[tool.setuptools.dynamic]
version = { attr = "invincible.__version__" }

[tool.setuptools.packages.find]
include = ["invincible*"]

[tool.setuptools.package-data]
invincible = [
    "providers.yaml",
    "migrations/script.py.mako",
    "templates/*.html",
    "templates/**/*.html",
    "templates/static/*",
    "templates/static/**/*",
]

[tool.ruff]
target-version = "py310"
exclude = [
    "venv",
    ".venv",
    ".venv-review",
    ".venv-package-test",
    ".verify",
    "build",
    "dist",
    ".pytest_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection calls are the sanctioned default-argument
# idiom (Depends(require_auth) on route handlers).
extend-immutable-calls = ["fastapi.Depends"]
