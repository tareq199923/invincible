# Invincible app + postgres pair (Phase 16).
#
# `docker compose up` yields a running gateway with zero manual SQL: the
# app container runs `invincible db upgrade` (as the migration role)
# before starting uvicorn (as the runtime role). See docker/db-init/.
#
# ALL passwords below are DEV-ONLY defaults kept so the pair works
# out-of-the-box on localhost; override every ${VAR} for anything
# reachable outside your machine. Auth is enforced (scram-sha-256) and
# neither application role is a superuser.
services:
  db:
    image: postgres:16-alpine
    environment:
      # Bootstrap superuser: used ONLY by the init script to create the
      # least-privilege roles. Nothing connects as `postgres` afterwards.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev-change-me}
      POSTGRES_DB: invincible
      # Enforce password auth on every TCP connection - never `trust`.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      INVINCIBLE_MIGRATE_PASSWORD: ${INVINCIBLE_MIGRATE_PASSWORD:-dev-migrate-change-me}
      INVINCIBLE_APP_PASSWORD: ${INVINCIBLE_APP_PASSWORD:-dev-app-change-me}
    ports:
      - "127.0.0.1:${INVINCIBLE_DB_PORT:-5433}:5432"
    volumes:
      - invincible-pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invincible_app -d invincible"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Runtime role: CRUD only (grants in docker/db-init/01-roles.sh).
      INVINCIBLE_DB_URL: postgresql+asyncpg://invincible_app:${INVINCIBLE_APP_PASSWORD:-dev-app-change-me}@db:5432/invincible
      # Migration role: owns the schema. Used ONLY by the `db upgrade`
      # step in the command below - never by the running app.
      INVINCIBLE_MIGRATE_DB_URL: postgresql+asyncpg://invincible_migrate:${INVINCIBLE_MIGRATE_PASSWORD:-dev-migrate-change-me}@db:5432/invincible
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      INVINCIBLE_OWNER_SECRET: ${INVINCIBLE_OWNER_SECRET:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TOKENROUTER_API_KEY: ${TOKENROUTER_API_KEY:-}
    # Migrations run under the migration role (per-command env override);
    # the server itself then runs under the runtime role.
    command: >
      sh -c "INVINCIBLE_DB_URL=\"$$INVINCIBLE_MIGRATE_DB_URL\" invincible db upgrade &&
             exec uvicorn invincible.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

volumes:
  invincible-pgdata:
