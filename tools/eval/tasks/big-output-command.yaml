id: big-output-command
category: read
tags: [harder]
prompt: |-
  gen.py prints about 5000 lines. Run it in your working directory and
  report the single line containing NEEDLE-7749, exactly as
  FOUND=<that line>. The output is too large to read in one go: filter
  it (findstr) instead of dumping everything. Your shell starts in the
  server directory, NOT the workspace: prefix every command with
  `cd /d "{{WORKSPACE}}" && ` (exact quotes).
files:
  gen.py: |-
    for i in range(1, 5001):
        if i == 4500:
            print(f"line {i}: NEEDLE-7749 end of record")
        else:
            print(f"line {i}: filler filler filler filler filler filler filler")
checks:
  - type: final_text_contains
    pattern: NEEDLE-7749
  - type: approvals_denied_max
    max: 0
max_tool_calls: 8
timeout_seconds: 240
reference:
  files: {}
  final_text: |-
    FOUND=line 4500: NEEDLE-7749 end of record
