id: glob-nested
category: read
tags: [harder]
prompt: |-
  A nested tree of about 60 files sits under tree/ in your working
  directory. Report the EXACT count and the relative paths of all files
  matching the rule below, found under tree/alpha or tree/beta at any
  depth (files under tree/gamma in any form do NOT count). Matching
  rule: a file matches iff its base name ends with `_report.txt`
  exactly, case-sensitive (so `.bak`, `.csv`, `-report`, and uppercase
  variants do NOT match). Report exactly as COUNT=<number> followed by
  one relative path per line.
