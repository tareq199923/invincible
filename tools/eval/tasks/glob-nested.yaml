id: glob-nested
category: read
tags: [harder]
prompt: |-
  A nested tree of about 40 files sits under tree/ in your working
  directory. Report the EXACT count and the relative paths of all
  files matching `*_report.txt` found DIRECTLY under tree/alpha or
  tree/beta (any depth below those two folders counts, but files
  under tree/gamma in any form do NOT count). Report exactly as
  COUNT=<number> followed by one relative path per line.
