id: many-files-read
category: read
tags: [harder]
prompt: |-
  Twelve node logs (logs/node_01.log through logs/node_12.log) sit in
  your working directory. Each log records request attempts and their
  results, plus which service each node runs. Answer: which service
  logged a timeout on its third attempt, and what retry delay (in ms)
  was configured for that service? Output your answer as exactly one
  line in the format SERVICE=<name> DELAY_MS=<number>.
files: {}
generate:
  - kind: retry_logs
    paths:
      - logs/node_01.log
      - logs/node_02.log
      - logs/node_03.log
      - logs/node_04.log
      - logs/node_05.log
      - logs/node_06.log
      - logs/node_07.log
      - logs/node_08.log
      - logs/node_09.log
      - logs/node_10.log
      - logs/node_11.log
      - logs/node_12.log
    seed: 7
    size_bytes: 8192
    facts:
      nodes:
        node_01: logs/node_01.log
        node_02: logs/node_02.log
        node_03: logs/node_03.log
        node_04: logs/node_04.log
        node_05: logs/node_05.log
        node_06: logs/node_06.log
        node_07: logs/node_07.log
        node_08: logs/node_08.log
        node_09: logs/node_09.log
        node_10: logs/node_10.log
        node_11: logs/node_11.log
        node_12: logs/node_12.log
      services:
        node_01: vega
        node_02: meridian
        node_03: relay
        node_04: vega
        node_05: meridian
        node_06: relay
        node_07: vega
        node_08: halcyon
        node_09: meridian
        node_10: relay
        node_11: meridian
        node_12: vega
      true_event:
        file: logs/node_11.log
        req: q9z4
        node: node_11
        attempt: 3
        result: timeout
        approx_line: 60
      policy:
        file: logs/node_02.log
        service: meridian
        delay_ms: 400
        approx_line: 3
      decoy_policy:
        file: logs/node_02.log
        service: halcyon
        delay_ms: 250
      decoys:
        - file: logs/node_05.log
          req: a1b2
          node: node_05
          attempt: 2
          result: timeout
          approx_line: 40
        - file: logs/node_08.log
          req: c3d4
          node: node_08
          attempt: 2
          result: timeout
          approx_line: 40
        - file: logs/node_09.log
          req: e5f6
          node: node_09
          attempt: 3
          result: ok
          approx_line: 40
checks:
  - type: final_text_contains
    pattern: (?<![\w])SERVICE=meridian[ \t]+DELAY_MS=400\b
  - type: final_text_not_contains
    pattern: (?<![\w])SERVICE=halcyon[ \t]+DELAY_MS=250
# Budget is a sanity bound only: the round cap is the real constraint.
# A correct run (b694f35d080f) read 11 logs one call at a time and was
# failed on budget at 19 calls, so keep this well above that.
max_tool_calls: 30
timeout_seconds: 240
reference:
  files: {}
  final_text: |-
    SERVICE=meridian DELAY_MS=400
