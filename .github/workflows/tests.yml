name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Phase 16 contract: the suite reads INVINCIBLE_TEST_DATABASE_URL.
    # CI publishes Postgres on 5432 (the local convention stays 5433 via
    # compose / `invincible dev-db` — do not "align" them). Trust auth and
    # no password keep the DSN shape identical to the laptop default
    # (postgresql+asyncpg://invincible@host/db), so no test helper needs
    # password handling. The service is ephemeral CI infrastructure.
    env:
      INVINCIBLE_TEST_DATABASE_URL: postgresql+asyncpg://invincible@127.0.0.1:5432/invincible_test

    strategy:
      fail-fast: false
      matrix:
        # Matches pyproject requires-python (>=3.10): every claimed
        # version is actually tested — against real Postgres, not mocks.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: invincible          # superuser: scratch-DB tests CREATE/DROP databases
          POSTGRES_DB: invincible_test       # matches tests/conftest.py default
          POSTGRES_HOST_AUTH_METHOD: trust   # passwordless by design; POSTGRES_PASSWORD deliberately unset
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invincible -d invincible_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package
        run: pip install -e ".[dev]"

      # Fail fast with one clear message if the service is broken, instead
      # of 500 connection errors from the suite. asyncpg.connect does not
      # accept the SQLAlchemy "+asyncpg" driver suffix, so strip it.
      - name: Verify PostgreSQL connectivity
        run: |
          python -c """
          import asyncio, os, asyncpg

          dsn = os.environ['INVINCIBLE_TEST_DATABASE_URL'].replace('+asyncpg', '')

          async def main():
              conn = await asyncpg.connect(dsn)
              version = await conn.fetchval('SELECT version()')
              print('Connected:', version.split(',')[0])
              await conn.close()

          asyncio.run(main())
          """

      - name: Lint with Ruff
        run: ruff check .

      # Storage fixtures (pg_engine/client) hard-fail — they never skip —
      # so a red job here means the suite genuinely could not reach or use
      # Postgres. Scratch-database tests exercise CREATE/DROP DATABASE on
      # the maintenance DB `postgres`, which initdb always creates.
      - name: Run tests with coverage
        run: pytest -q --cov=invincible --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
