name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Phase 16 contract: the suite reads INVINCIBLE_TEST_DATABASE_URL.
    # CI publishes Postgres on 5432 (the local convention stays 5433 via
    # compose / `invincible dev-db` — do not "align" them). Trust auth and
    # no password keep the DSN shape identical to the laptop default
    # (postgresql+asyncpg://invincible@host/db), so no test helper needs
    # password handling. The container is ephemeral CI infrastructure.
    env:
      INVINCIBLE_TEST_DATABASE_URL: postgresql+asyncpg://invincible@127.0.0.1:5432/invincible_test

    strategy:
      fail-fast: false
      matrix:
        # Matches pyproject requires-python (>=3.10): every claimed
        # version is actually tested — against real Postgres, not mocks.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    # No `services:` block by design: the runner pulls service images
    # with no retry and no log access, so one registry hiccup fails all
    # five jobs in "Initialize containers" before any step runs (run
    # #264, attempts 1-2). Starting the identical postgres:17 container
    # in a step keeps image/env/ports/DSN shape with pull + readiness
    # retries under our control.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package
        run: pip install -e ".[dev]"

      # Same postgres:17 the services block used to start (superuser for
      # scratch-DB tests that CREATE/DROP databases; trust auth so the
      # DSN stays passwordless). Pull retries ride out registry hiccups;
      # the pg_isready loop replaces the old service health check.
      - name: Start PostgreSQL
        run: |
          for i in 1 2 3 4 5 6; do
            docker pull postgres:17 && break || echo "pull attempt $i failed; retrying"
            sleep 20
          done
          docker image inspect postgres:17 >/dev/null || { echo "postgres:17 pull failed after retries"; exit 1; }
          docker run -d --name invincible-pg \
            -e POSTGRES_USER=invincible \
            -e POSTGRES_DB=invincible_test \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            postgres:17
          for i in $(seq 1 60); do
            if docker exec invincible-pg pg_isready -U invincible -d invincible_test; then
              break
            fi
            sleep 2
          done
          docker exec invincible-pg pg_isready -U invincible -d invincible_test

      # Fail fast with one clear message if the database is broken, instead
      # of 500 connection errors from the suite. asyncpg.connect does not
      # accept the SQLAlchemy "+asyncpg" driver suffix, so strip it.
      - name: Verify PostgreSQL connectivity
        run: |
          python -c """
          import asyncio, os, asyncpg

          dsn = os.environ['INVINCIBLE_TEST_DATABASE_URL'].replace('+asyncpg', '')

          async def main():
              conn = await asyncpg.connect(dsn)
              version = await conn.fetchval('SELECT version()')
              print('Connected:', version.split(',')[0])
              await conn.close()

          asyncio.run(main())
          """

      - name: Lint with Ruff
        run: ruff check .

      # Storage fixtures (pg_engine/client) hard-fail — they never skip —
      # so a red job here means the suite genuinely could not reach or use
      # Postgres. Scratch-database tests exercise CREATE/DROP DATABASE on
      # the maintenance DB `postgres`, which initdb always creates.
      - name: Run tests with coverage
        run: pytest -q --cov=invincible --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
