name: Release

# Tag push (`git tag v0.3.0 && git push origin v0.3.0`) or a manual run builds
# the sdist + wheel, validates them with twine, runs the packaging smoke test,
# and uploads the artifacts. The publish job is opt-in: only a manual run with
# publish=true reaches PyPI, and only after the "pypi" environment is bound as
# a trusted publisher on pypi.org (see docs/RELEASING.md). Dispatch the manual
# run against the TAG, not a branch — the build checks out the ref you pick.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built artifacts to PyPI"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        # The dev extra carries build, twine, pytest and setuptools>=77 —
        # the smoke test below builds --no-isolation and imports invincible
        # in this interpreter, so the runtime deps have to be here too.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      # The actual correctness gate: rebuilds the artifacts, installs the
      # wheel into a scratch venv and asserts the packaged surface from
      # inside it. Slow-marked, so `-m slow` is required to override
      # pytest.ini's default deselect. It runs here, before the artifact
      # exists, because `publish` needs this job and a PyPI version is
      # immutable — a wheel missing a template can only be yanked.
      - name: Packaging smoke test
        run: pytest -q -m slow tests/test_wheel_contents.py

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    # Deliberately unreachable by tag pushes: publishing is a human
    # decision made through a manual run with publish=true. The string
    # comparison is not redundant — the UI checkbox arrives as a real
    # boolean, but a REST/`gh` dispatch submits inputs as strings, and a
    # type mismatch here would skip this job silently.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.publish == true || inputs.publish == 'true')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # OIDC trusted-publisher auth — no API token stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1