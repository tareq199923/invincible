name: Release

# Tag push (`git tag v0.2.0 && git push --tags`) or a manual run builds the
# sdist + wheel, validates them with twine, and uploads the artifacts. The
# publish job is opt-in: only a manual run with publish=true reaches PyPI,
# and only after the "pypi" environment is bound as a trusted publisher on
# pypi.org (see docs/RELEASING.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built artifacts to PyPI"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    # Deliberately unreachable by tag pushes: publishing is a human
    # decision made through a manual run with publish=true.
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # OIDC trusted-publisher auth — no API token stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1