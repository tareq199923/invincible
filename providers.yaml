# DEPRECATED: the canonical copy of this configuration lives at
# invincible/providers.yaml and is loaded via importlib.resources.
# This repository-root copy is kept only for backward compatibility and is
# used solely as a fallback if the packaged resource is unavailable.
# It can be removed in a future release.
providers:
  - name: nim-glm
    tier: 1
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    model_id: z-ai/glm-5.2
    max_context: 1000000
    timeout:
      read: 90.0   # 1M-token context; generation can legitimately take a while

  - name: groq-llama
    tier: 2
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    model_id: openai/gpt-oss-120b
    max_context: 128000
    timeout:
      read: 45.0

  - name: openrouter-fallback
    tier: 3
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    max_context: 1000000
    timeout:
      read: 90.0   # 550B free tier can be slow to first token

  - name: gemini-flash
    tier: 4
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    model_id: gemini-2.5-flash
    max_context: 1000000
    timeout:
      read: 90.0   # large-context requests can legitimately take longer to generate