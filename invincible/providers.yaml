# Canonical provider configuration for Invincible.
# Packaged as package data and loaded via importlib.resources, so it works
# identically from a Git checkout, an editable install, or a wheel.
# This copy is authoritative and is the only configuration loaded; the
# deprecated root-level fallback was removed (Phase 11).
providers:
  - name: agentrouter-glm
    tier: 1
    base_url: https://agentrouter.org/v1
    api_key_env: AGENTROUTER_API_KEY
    model_id: glm-5.3           # TODO verify exact slug in your AgentRouter console (agentrouter.org/console)
    aliases: [agentrouter]
    max_context: 128000
    timeout:
      read: 90.0
    # AgentRouter WAF fingerprint-checks the client, not just the bearer
    # token - generic OpenAI-SDK-style requests get 401 unauthorized_client_error
    # regardless of key validity. These headers spoof a recognized client
    # (community workaround, not documented/stable - may stop working if
    # AgentRouter changes their allowlist).
    extra_headers:
      X-Stainless-OS: Linux
      X-Stainless-Arch: x64
      X-Stainless-Lang: js
      X-Stainless-Runtime: node
      X-Stainless-Runtime-Version: v22.22.1
      HTTP-Referer: https://github.com/RooVetGit/Roo-Cline
      X-Title: Roo Code
      User-Agent: RooCode/3.53.0

  - name: tokenrouter-qwen
    tier: 2
    base_url: https://api.tokenrouter.com/v1
    api_key_env: TOKENROUTER_API_KEY
    model_id: qwen/qwen3.8-max-free
    max_context: 1000000
    failover_on_400: true
    timeout:
      read: 90.0

  - name: nim-deepseek
    tier: 3
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    model_id: deepseek-ai/deepseek-v4-flash-0731
    aliases: [strong]
    max_context: 1000000
    timeout:
      read: 90.0

  - name: groq-llama
    tier: 4
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    model_id: openai/gpt-oss-120b
    aliases: [fast]
    max_context: 128000
    timeout:
      read: 45.0

  - name: openrouter-fallback
    tier: 5
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    aliases: [free]
    max_context: 1000000
    timeout:
      read: 90.0

  - name: gemini-flash
    tier: 6
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    model_id: gemini-2.5-flash
    aliases: [backup]
    max_context: 1000000
    timeout:
      read: 90.0
