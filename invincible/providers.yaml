# Canonical provider configuration for Invincible.
# Packaged as package data and loaded via importlib.resources, so it works
# identically from a Git checkout, an editable install, or a wheel.
# This copy is authoritative and is the only configuration loaded; the
# deprecated root-level fallback was removed (Phase 11).
providers:
  - name: tokenrouter-qwen
    tier: 1
    base_url: https://api.tokenrouter.com/v1
    api_key_env: TOKENROUTER_API_KEY
    model_id: qwen/qwen3.8-max-free
    max_context: 1000000
    # Free tier is unreliable on large/tool-heavy requests (Claude Code
    # sends its full ~30-tool schema on every turn): observed both a
    # generic 400 ("bad_response_status_code") and a 403 ("no access to
    # model alpha-model") for the *same* payload on different attempts,
    # meaning tokenrouter sometimes internally reroutes heavy requests to
    # a backend this free token can't reach. Fail over to the next tier
    # instead of surfacing that as a hard error to the client.
    failover_on_400: true
    timeout:
      read: 90.0   # free tier can be slow to first token

  - name: nim-deepseek
    tier: 2
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    model_id: deepseek-ai/deepseek-v4-flash-0731
    aliases: [strong]           # request "strong" to prefer this provider
    max_context: 1000000
    timeout:
      read: 90.0   # 1M-token context; generation can legitimately take a while

  - name: groq-llama
    tier: 3
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    model_id: openai/gpt-oss-120b
    aliases: [fast]             # request "fast" to prefer this provider
    max_context: 128000
    timeout:
      read: 45.0

  - name: openrouter-fallback
    tier: 4
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    aliases: [free]             # request "free" to prefer this provider
    max_context: 1000000
    timeout:
      read: 90.0   # 550B free tier can be slow to first token

  - name: gemini-flash
    tier: 5
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    model_id: gemini-2.5-flash
    aliases: [backup]           # request "backup" to prefer this provider
    max_context: 1000000
    timeout:
      read: 90.0   # large-context requests can legitimately take longer to generate