<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Invincible{% endblock %}</title>
  <script src="/static/htmx.min.js" defer></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem;
           margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 a { text-decoration: none; color: inherit; }
    label { display: block; margin-top: 0.9rem; font-weight: 600; }
    input[type=email], input[type=password], input[type=text], textarea {
      width: 100%; padding: 0.5rem; margin-top: 0.25rem;
      border: 1px solid #bbb; border-radius: 4px; box-sizing: border-box; }
    textarea { resize: vertical; font: inherit; }
    button { margin-top: 1rem; padding: 0.5rem 1.2rem; cursor: pointer; }
    .error { color: #900; margin-top: 0.75rem; }
    .muted { color: #666; font-size: 0.9rem; }
    code.user-code { font-size: 1.4rem; letter-spacing: 0.15em; }
    table { border-collapse: collapse; width: 100%; }
    td, th { text-align: left; padding: 0.35rem 0.5rem;
             border-bottom: 1px solid #eee; }
    ul.plain { list-style: none; padding: 0; }
    .site-nav { display: flex; gap: 1rem; align-items: center;
                margin: 0.5rem 0 1.5rem; }
    .site-nav a { color: #0366d6; text-decoration: none; }
    .inline-form { display: inline; margin: 0; }
    button.linklike { background: none; border: none; padding: 0;
                      margin: 0; color: #0366d6; cursor: pointer;
                      font: inherit; text-decoration: underline; }
    .cards { display: grid;
             grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
             gap: 0.75rem; margin: 1rem 0; }
    .card { border: 1px solid #ddd; border-radius: 6px;
            padding: 0.75rem 0.9rem; }
    .card .num { display: block; font-size: 1.6rem; font-weight: 700; }
    .card .label { color: #666; font-size: 0.85rem; }
    .banner { border-left: 4px solid #b58900; background: #fdf6e3;
              padding: 0.6rem 0.8rem; margin: 1rem 0; }
    code.payload { font-size: 0.8rem; word-break: break-all; }
    .bars { display: flex; align-items: flex-end; gap: 0.5rem;
            height: 8rem; margin: 1rem 0; }
    .bar-col { display: flex; flex-direction: column; justify-content:
               flex-end; align-items: center; width: 2.4rem; height: 100%; }
    .bar { width: 100%; min-height: 1px; background: #0366d6;
           border-radius: 3px 3px 0 0; }
    .bar-day { font-size: 0.7rem; color: #666; margin-top: 0.25rem; }
    .bar-num { font-size: 0.65rem; }
  </style>
</head>
<body>
<h1><a href="/">Invincible</a></h1>
{% if user_email %}
<nav class="site-nav">
  <a href="/dashboard">Dashboard</a>
  <a href="/dashboard/sessions">Sessions</a>
  <a href="/dashboard/tasks">Tasks</a>
  <a href="/dashboard/memory">Memory</a>
  <a href="/dashboard/usage">Usage</a>
  <a href="/account">Account</a>
  <form method="post" action="/auth/logout" class="inline-form">
    <button type="submit" class="linklike">Sign out</button>
  </form>
</nav>
{% endif %}
{% block content %}{% endblock %}
</body>
</html>
